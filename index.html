<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="fox">
    <title>ДОСКА • Семья</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подключение Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-canvas: #090b10;
            --card-bg: #11141c;
            --border-glow: #00f2fe;
            --accent-green: #00ff66;
            --text-main: #e6edf3;
            --text-sub: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .edge-glitch-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 8000;
            box-shadow: inset 0 0 100px rgba(0, 242, 254, 0.1), inset 0 0 40px rgba(0, 255, 102, 0.1);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 6px 100%;
        }

        #cursor-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

        /* ЭКРАН ВХОДА */
        #auth-screen {
            position: fixed; inset: 0; background: #030406;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .auth-box {
            background: rgba(17, 20, 28, 0.98); padding: 40px; border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.2); text-align: center;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9); max-width: 360px; width: 100%;
        }
        .auth-box h2 { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; margin-bottom: 6px; color: #f0f6fc; }
        .auth-box p { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 24px; font-family: 'JetBrains Mono', monospace; }
        .auth-box input {
            width: 100%; padding: 12px; background: #050608; border: 1px solid #21262d; color: var(--border-glow);
            font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; letter-spacing: 6px; text-align: center; margin-bottom: 18px; border-radius: 6px; outline: none;
        }
        .auth-box button {
            width: 100%; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #000; border: none; padding: 12px;
            font-family: 'JetBrains Mono', monospace; font-weight: 700; cursor: pointer; border-radius: 6px;
        }

        /* ЭКРАН СТОЛА (ОТДАЛЁННЫЙ) */
        #room-screen {
            position: fixed; inset: 0; z-index: 9000; background: #08090c;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #room-bg-group {
            position: absolute; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.25, 1), opacity 0.35s ease;
        }
        .room-bg-img {
            position: absolute; max-width: 100%; max-height: 100%; object-fit: contain;
            transition: opacity 0.35s ease;
        }
        #room-bg-hover { opacity: 0; pointer-events: none; }
        
        .tablet-hotspot {
            position: absolute; top: 52%; left: 51.8%; transform: translate(-50%, -50%);
            width: 180px; height: 110px; cursor: pointer; z-index: 9001;
        }

        .zoom-active #room-bg-group { transform: scale(2.8); opacity: 0; }
        .zoom-active .tablet-hotspot { opacity: 0; pointer-events: none; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        #toolbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(17, 20, 26, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 18px; border-radius: 30px;
            display: flex; gap: 12px; align-items: center; z-index: 1000;
        }
        .tool-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #00c6ff 100%); color: #060709; border: none; padding: 10px 20px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }

        /* ОКНО СОЗДАНИЯ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 4, 6, 0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 9000;
        }
        .modal-box {
            background: #11141a; border: 1px solid rgba(255, 255, 255, 0.1); padding: 26px; border-radius: 12px;
            width: 360px; display: flex; flex-direction: column; gap: 14px;
        }
        .modal-input, .modal-textarea {
            width: 100%; background: #08090c; border: 1px solid #21262d; color: #c9d1d9;
            padding: 11px; border-radius: 6px; outline: none; font-size: 0.85rem;
        }
        .modal-file-label {
            display: block; width: 100%; padding: 11px; background: #161b22; border: 1px dashed #30363d;
            color: var(--text-sub); text-align: center; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
        }
        .preview-img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; display: none; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-cancel { width: 50%; background: #21262d; color: var(--text-sub); border: none; padding: 10px; cursor: pointer; border-radius: 6px; }
        .btn-confirm { width: 50%; background: var(--border-glow); color: #000; border: none; padding: 10px; cursor: pointer; border-radius: 6px; font-weight: 700; }

        /* ХОЛСТ */
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; cursor: grab; }
        #viewport:active { cursor: grabbing; }

        #workspace {
            position: absolute; width: 8000px; height: 8000px; background-color: var(--bg-canvas);
            background-image: radial-gradient(rgba(0, 242, 254, 0.07) 1px, transparent 1px); background-size: 32px 32px;
            transform-origin: 0 0;
        }

        #svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        path.thread { stroke: var(--border-glow); stroke-width: 2.5; fill: none; stroke-linecap: round; pointer-events: stroke; cursor: pointer; }
        path.thread:hover { stroke-width: 4; stroke: #ff0055; }

        .card {
            position: absolute; background: var(--card-bg); color: var(--text-main);
            width: 270px; padding: 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: grab; z-index: 10;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--border-glow); }
        .delete-card { background: none; border: none; color: #484f58; cursor: pointer; }
        .delete-card:hover { color: #f85149; }
        .card-name { font-size: 1.05rem; font-weight: 700; color: #f0f6fc; margin-bottom: 8px; }
        .card-img-container { width: 100%; height: 165px; background: #08090c; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .card-notes { width: 100%; background: #08090c; border: 1px solid rgba(255, 255, 255, 0.08); color: #c9d1d9; font-size: 0.8rem; padding: 8px; border-radius: 6px; resize: none; outline: none; }
        .connector { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; background: #00f2fe; border-radius: 50%; cursor: crosshair; z-index: 15; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="edge-glitch-overlay"></div>
    <canvas id="cursor-canvas"></canvas>

    <!-- 1. ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>ДОСТУП К ДОСКЕ</h2>
            <p>ВВЕДИТЕ ПИН-КОД</p>
            <input type="password" id="pass-input" placeholder="••••" maxlength="10">
            <button onclick="login()">ПОДТВЕРДИТЬ</button>
            <div id="error-msg" style="color: #f85149; font-size: 0.75rem; margin-top: 12px; font-family: 'JetBrains Mono', monospace; min-height: 15px;"></div>
        </div>
    </div>

    <!-- 2. ЭКРАН СТОЛА -->
    <div id="room-screen" style="display: none;">
        <div id="room-bg-group">
            <img id="room-bg" class="room-bg-img" src="desk.jpg" alt="Стол">
            <img id="room-bg-hover" class="room-bg-img" src="deskn.jpg" alt="Планшет">
        </div>
        <div class="tablet-hotspot" id="tablet-btn" onclick="zoomIntoTablet()"></div>
    </div>

    <!-- 3. ВЕРХНЕЕ МЕНЮ -->
    <div id="toolbar">
        <button class="tool-btn" onclick="openAddModal()">+ Добавить члена семьи</button>
    </div>

    <!-- 4. ОКНО ДОБАВЛЕНИЯ -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3 style="color:#fff;">НОВЫЙ ЧЛЕН СЕМЬИ</h3>
            <input type="text" id="modal-name" class="modal-input" placeholder="Имя и Фамилия...">
            <input type="text" id="modal-role" class="modal-input" placeholder="Роль (Брат, Сестра)...">
            <textarea id="modal-desc" class="modal-textarea" rows="3" placeholder="Заметки..."></textarea>
            
            <label for="modal-file-input" class="modal-file-label" id="modal-file-label">📷 Загрузить фото</label>
            <input type="file" id="modal-file-input" accept="image/*" onchange="previewModalImage(this)">
            <img id="modal-preview-img" class="preview-img">

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
                <button class="btn-confirm" onclick="confirmAddCard()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- 5. ДОСКА -->
    <div id="viewport">
        <div id="workspace">
            <svg id="svg-layer"></svg>
        </div>
    </div>

    <script>
        // === НАСТРОЙКА FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyA6niOG7ITQdSLI6iRScUvkdkkNouzCkNM",
            authDomain: "sosiska-family.firebaseapp.com",
            databaseURL: "https://sosiska-family-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sosiska-family",
            storageBucket: "sosiska-family.firebasestorage.app",
            messagingSenderId: "527481945819",
            appId: "1:527481945819:web:7e7ea02873809406f156fe",
            measurementId: "G-51DKR1NY40"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) { console.log("Firebase ошибка инициализации:", e); }

        // === ПАРОЛЬ (2026) ===
        const TARGET_HASH = "158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab";
        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function login() {
            const input = document.getElementById('pass-input').value.trim();
            if ((await sha256(input)) === TARGET_HASH) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('room-screen').style.display = 'flex';
            } else {
                document.getElementById('error-msg').innerText = "Неверный код доступа";
            }
        }

        // Подсвечивание планшета
        const tabletBtn = document.getElementById('tablet-btn');
        const roomBgHover = document.getElementById('room-bg-hover');
        tabletBtn.addEventListener('mouseenter', () => roomBgHover.style.opacity = '1');
        tabletBtn.addEventListener('mouseleave', () => roomBgHover.style.opacity = '0');

        function zoomIntoTablet() {
            document.getElementById('room-screen').classList.add('zoom-active');
            setTimeout(() => {
                document.getElementById('room-screen').style.display = 'none';
                initBoard();
            }, 750);
        }

        // === ХАКЕРСКИЙ КУРСОР ===
        const canvas = document.getElementById('cursor-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const chars = ['0', '1', 'X', '#', '_'];

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.3) {
                particles.push({
                    x: e.clientX, y: e.clientY,
                    char: chars[Math.floor(Math.random() * chars.length)],
                    size: Math.floor(Math.random() * 6) + 11,
                    vx: (Math.random() - 0.5) * 1.5, vy: -1,
                    color: Math.random() > 0.4 ? '#00f2fe' : '#00ff66', alpha: 1
                });
            }
        });

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.035;
                if (p.alpha <= 0) particles.splice(i, 1);
                else {
                    ctx.save(); ctx.globalAlpha = p.alpha;
                    ctx.font = `${p.size}px 'JetBrains Mono'`; ctx.fillStyle = p.color;
                    ctx.fillText(p.char, p.x, p.y); ctx.restore();
                }
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // === ДВИЖОК ДОСКИ ===
        const viewport = document.getElementById('viewport');
        const workspace = document.getElementById('workspace');
        const svgLayer = document.getElementById('svg-layer');

        let panX = -3500, panY = -3500, isPanning = false, startX, startY;
        let cards = [], links = [], cardCounter = 0;
        let isDraggingCard = false, activeCard = null;
        let isDrawingThread = false, threadStartCardId = null, tempThread = null;
        let tempModalImageData = null;

        function initBoard() {
            workspace.style.transform = `translate(${panX}px, ${panY}px)`;
            
            // Синхронизация с Firebase в реальном времени
            if (db) {
                db.ref('family_board').on('value', (snapshot) => {
                    const data = snapshot.val() || { cards: [], links: [] };
                    clearBoardUI();
                    cards = [];
                    links = data.links || [];
                    (data.cards || []).forEach(c => {
                        if (c.id > cardCounter) cardCounter = c.id;
                        renderCardInstance(c);
                    });
                    renderThreads();
                });
            }
        }

        function saveToCloud() {
            if (db) {
                db.ref('family_board').set({
                    cards: cards.map(c => c.data),
                    links: links
                });
            }
        }

        function clearBoardUI() {
            document.querySelectorAll('.card').forEach(el => el.remove());
            svgLayer.innerHTML = '';
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target === workspace || e.target === svgLayer) {
                isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX; panY = e.clientY - startY;
                workspace.style.transform = `translate(${panX}px, ${panY}px)`;
            }
            if (isDraggingCard && activeCard) {
                const x = e.clientX - panX - activeCard.offsetX;
                const y = e.clientY - panY - activeCard.offsetY;
                activeCard.el.style.left = `${x}px`; activeCard.el.style.top = `${y}px`;
                activeCard.data.left = x; activeCard.data.top = y;
                updateThreads();
            }
            if (isDrawingThread && tempThread) {
                const rect = workspace.getBoundingClientRect();
                const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
                const startCard = cards.find(c => c.id === threadStartCardId).el;
                const sRect = startCard.getBoundingClientRect();
                const sx = sRect.left + sRect.width / 2 - rect.left, sy = sRect.bottom - 7 - rect.top;
                tempThread.setAttribute('d', `M ${sx} ${sy} C ${sx} ${(sy + mouseY)/2}, ${mouseX} ${(sy + mouseY)/2}, ${mouseX} ${mouseY}`);
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            if (isDraggingCard) { isDraggingCard = false; activeCard = null; saveToCloud(); }
            if (isDrawingThread) { isDrawingThread = false; if (tempThread) tempThread.remove(); tempThread = null; }
        });

        function openAddModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-role').value = '';
            document.getElementById('modal-desc').value = '';
            document.getElementById('modal-preview-img').style.display = 'none';
            tempModalImageData = null;
        }

        function closeAddModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        function previewModalImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                tempModalImageData = e.target.result;
                const img = document.getElementById('modal-preview-img');
                img.src = tempModalImageData; img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function confirmAddCard() {
            cardCounter++;
            const cardData = {
                id: cardCounter,
                name: document.getElementById('modal-name').value.trim() || "Без имени",
                role: document.getElementById('modal-role').value.trim() || "Семья",
                desc: document.getElementById('modal-desc').value.trim() || "",
                imgSrc: tempModalImageData || "https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?auto=format&fit=crop&w=300&q=80",
                left: -panX + window.innerWidth / 2 - 135,
                top: -panY + window.innerHeight / 2 - 150
            };
            cards.push({ id: cardData.id, el: null, data: cardData });
            saveToCloud();
            closeAddModal();
        }

        function renderCardInstance(data) {
            const card = document.createElement('div');
            card.className = 'card'; card.dataset.id = data.id;
            card.style.left = `${data.left}px`; card.style.top = `${data.top}px`;
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-tag">${data.role}</span>
                    <button class="delete-card" onclick="deleteCard(${data.id})">✕</button>
                </div>
                <div class="card-name">${data.name}</div>
                <div class="card-img-container"><img src="${data.imgSrc}"></div>
                <textarea class="card-notes" rows="3" placeholder="Заметки...">${data.desc}</textarea>
                <div class="connector"></div>
            `;
            attachCardEvents(card, data.id, data);
            workspace.appendChild(card);
            const found = cards.find(c => c.id === data.id);
            if (found) found.el = card; else cards.push({ id: data.id, el: card, data });
        }

        function attachCardEvents(card, id, dataObj) {
            card.addEventListener('mousedown', (e) => {
                if (['TEXTAREA', 'BUTTON'].includes(e.target.tagName) || e.target.classList.contains('connector')) return;
                isDraggingCard = true;
                activeCard = { el: card, data: dataObj, offsetX: e.clientX - card.getBoundingClientRect().left, offsetY: e.clientY - card.getBoundingClientRect().top };
            });

            card.querySelector('.card-notes').addEventListener('change', (e) => {
                dataObj.desc = e.target.value;
                saveToCloud();
            });

            const connector = card.querySelector('.connector');
            connector.addEventListener('mousedown', (e) => {
                e.stopPropagation(); isDrawingThread = true; threadStartCardId = id;
                tempThread = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempThread.classList.add('thread'); svgLayer.appendChild(tempThread);
            });

            connector.addEventListener('mouseup', (e) => {
                e.stopPropagation();
                if (isDrawingThread && threadStartCardId && threadStartCardId !== id) {
                    if (!links.some(l => (l.from === threadStartCardId && l.to === id) || (l.from === id && l.to === threadStartCardId))) {
                        links.push({ from: threadStartCardId, to: id });
                        saveToCloud();
                    }
                }
            });
        }

        function deleteCard(id) {
            cards = cards.filter(c => c.id !== id);
            links = links.filter(l => l.from !== id && l.to !== id);
            saveToCloud();
        }

        function renderThreads() {
            svgLayer.innerHTML = '';
            links.forEach((link, index) => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.classList.add('thread'); path.dataset.index = index;
                path.addEventListener('click', () => { links.splice(index, 1); saveToCloud(); });
                svgLayer.appendChild(path);
            });
            updateThreads();
        }

        function updateThreads() {
            const rect = workspace.getBoundingClientRect();
            document.querySelectorAll('path.thread[data-index]').forEach(path => {
                const link = links[parseInt(path.dataset.index)];
                if (!link) return;
                const c1 = cards.find(c => c.id === link.from), c2 = cards.find(c => c.id === link.to);
                if (!c1 || !c2 || !c1.el || !c2.el) return;
                const r1 = c1.el.getBoundingClientRect(), r2 = c2.el.getBoundingClientRect();
                const x1 = r1.left + r1.width / 2 - rect.left, y1 = r1.bottom - 7 - rect.top;
                const x2 = r2.left + r2.width / 2 - rect.left, y2 = r2.top + 7 - rect.top;
                path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${(y1 + y2)/2}, ${x2} ${(y1 + y2)/2}, ${x2} ${y2}`);
            });
        }
    </script>
</body>
</html>
