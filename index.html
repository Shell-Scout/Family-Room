<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="fox">
    <title>Семейный Архив • Доска Расследований</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #1e1e24;
            --cork-color: #d4a373;
            --card-bg: #fffcf2;
            --text-main: #1a1a1a;
            --thread-color: #e63946;
            --border-color: #444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* АВТОРИЗАЦИЯ */
        #auth-screen {
            position: fixed; inset: 0; background: #0c0d0e;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .auth-box {
            background: #181a1b; padding: 35px; border-radius: 12px; border: 1px solid #333; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-width: 380px; width: 100%;
        }
        .auth-box h2 { font-family: 'Special Elite', cursive; margin-bottom: 15px; letter-spacing: 1px; }
        .auth-box input {
            width: 100%; padding: 12px; background: #222527; border: 1px solid #444; color: #fff;
            font-size: 1.5rem; letter-spacing: 6px; text-align: center; margin: 15px 0; border-radius: 6px; outline: none;
        }
        .auth-box button {
            width: 100%; background: #238636; color: white; border: none; padding: 12px; font-size: 1rem;
            font-weight: 600; cursor: pointer; border-radius: 6px; transition: background 0.2s;
        }
        .auth-box button:hover { background: #2ea043; }

        /* ВЕРХНЯЯ ПАНЕЛЬ ИНСТРУМЕНТОВ */
        #toolbar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(24, 26, 27, 0.9); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1); padding: 8px 18px; border-radius: 30px;
            display: flex; gap: 12px; align-items: center; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .tool-btn {
            background: #2a2d30; color: #fff; border: 1px solid #444; padding: 8px 16px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: flex;
            align-items: center; gap: 6px; transition: all 0.2s;
        }
        .tool-btn:hover { background: #3a3d40; border-color: #666; }
        .tool-btn.primary { background: #238636; border-color: #2ea043; }
        .tool-btn.primary:hover { background: #2ea043; }

        /* ИНТЕРАКТИВНЫЙ ХОЛСТ */
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; cursor: grab; }
        #viewport:active { cursor: grabbing; }

        #workspace {
            position: absolute; width: 8000px; height: 8000px;
            background-color: #1a1c1e;
            background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 28px 28px;
            transform-origin: 0 0;
        }

        /* СЛОЙ НИТОК */
        #svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        path.thread {
            stroke: var(--thread-color); stroke-width: 3.5; fill: none; stroke-linecap: round;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6)); pointer-events: stroke; cursor: pointer;
        }
        path.thread:hover { stroke-width: 6; stroke: #ff4d5a; }

        /* КАРТОЧКИ УЛИК */
        .card {
            position: absolute; background: var(--card-bg); color: var(--text-main);
            width: 240px; border-radius: 4px; padding: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            border: 1px solid #d0d0d0; cursor: grab; z-index: 10; transition: box-shadow 0.2s;
        }
        .card:active { cursor: grabbing; z-index: 100; box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
        
        /* Кнопка удаления и красная кнопка-булавка */
        .card-pin {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 16px; background: #d90429; border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 12;
        }
        .delete-card {
            position: absolute; top: 6px; right: 8px; background: none; border: none;
            color: #999; font-size: 14px; cursor: pointer; font-weight: bold;
        }
        .delete-card:hover { color: #d90429; }

        .card input.card-title {
            width: 85%; border: none; background: transparent; font-family: 'Special Elite', cursive;
            font-size: 1.05rem; font-weight: bold; color: #111; margin-bottom: 8px; outline: none;
        }
        .card textarea.card-text {
            width: 100%; border: none; background: transparent; font-family: 'Inter', sans-serif;
            font-size: 0.85rem; color: #333; resize: none; outline: none; line-height: 1.3;
        }

        /* Загрузка изображений на карточку */
        .card-img-container {
            width: 100%; height: 150px; background: #e9ecef; border-radius: 4px;
            margin-bottom: 8px; overflow: hidden; position: relative; display: flex;
            align-items: center; justify-content: center; border: 1px dashed #ccc;
        }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .change-img-btn {
            position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7); color: #fff;
            border: none; padding: 4px 8px; font-size: 0.7rem; border-radius: 3px; cursor: pointer; opacity: 0; transition: opacity 0.2s;
        }
        .card-img-container:hover .change-img-btn { opacity: 1; }

        /* Пин соединитель нити */
        .connector {
            position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 16px; background: var(--thread-color); border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.4); cursor: crosshair; z-index: 15;
            transition: transform 0.15s;
        }
        .connector:hover { transform: translateX(-50%) scale(1.3); }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>СЕКРЕТНЫЙ АРХИВ</h2>
            <p style="font-size: 0.85rem; color: #888;">Введите пароль доступа:</p>
            <input type="password" id="pass-input" placeholder="••••" maxlength="10">
            <button onclick="login()">Открыть доску</button>
            <div id="error-msg" style="color: #e63946; font-size: 0.8rem; margin-top: 10px; min-height: 15px;"></div>
        </div>
    </div>

    <!-- ВЕРХНЕЕ МЕНЮ -->
    <div id="toolbar">
        <button class="tool-btn primary" onclick="addTextCard()">+ Заметка</button>
        <button class="tool-btn primary" onclick="triggerImageUpload()">+ Картинка</button>
        <button class="tool-btn" id="rain-btn" onclick="toggleRain()">🌧️ Звук дождя</button>
    </div>

    <!-- ПОЛЕ ДОСКИ -->
    <div id="viewport">
        <div id="workspace">
            <svg id="svg-layer"></svg>
        </div>
    </div>

    <input type="file" id="global-file-input" accept="image/*">

    <script>
        // === 1. ЗАЩИТА SHA-256 (Пароль 2026) ===
        const TARGET_HASH = "21a7337a6b47c94b62f8e1329a1b80c355f309a4d8c838a1921356f9172e2764"; // SHA-256 от "2026"

        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function login() {
            const input = document.getElementById('pass-input').value;
            const inputHash = await sha256(input);
            
            if (inputHash === TARGET_HASH) {
                document.getElementById('auth-screen').style.display = 'none';
                initBoard();
            } else {
                document.getElementById('error-msg').innerText = "Неверный код доступа!";
                document.getElementById('pass-input').value = "";
            }
        }

        document.getElementById('pass-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        // === 2. ЗВУКОВОР ОБРАБОТЧИК ДОЖДЯ (Web Audio API) ===
        let audioCtx, noiseNode, isRainPlaying = false;
        function toggleRain() {
            const btn = document.getElementById('rain-btn');
            if (!isRainPlaying) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 2;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                    
                    noiseNode = audioCtx.createBufferSource();
                    noiseNode.buffer = buffer;
                    noiseNode.loop = true;
                    
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 450;
                    
                    noiseNode.connect(filter);
                    filter.connect(audioCtx.destination);
                    noiseNode.start();
                } else {
                    audioCtx.resume();
                }
                isRainPlaying = true;
                btn.style.borderColor = '#58a6ff';
                btn.innerText = '🔊 Дождь включен';
            } else {
                audioCtx.suspend();
                isRainPlaying = false;
                btn.style.borderColor = '#444';
                btn.innerText = '🌧️ Звук дождя';
            }
        }

        // === 3. ДВИЖОК ДОСКИ ===
        const viewport = document.getElementById('viewport');
        const workspace = document.getElementById('workspace');
        const svgLayer = document.getElementById('svg-layer');
        const fileInput = document.getElementById('global-file-input');

        let panX = -3500, panY = -3500;
        let isPanning = false, startX, startY;
        
        let cards = [];
        let links = [];
        let cardCounter = 0;

        let isDraggingCard = false, activeCard = null;
        let isDrawingThread = false, threadStartCardId = null, tempThread = null;
        let pendingImgCardId = null;

        function initBoard() {
            workspace.style.transform = `translate(${panX}px, ${panY}px)`;
            
            // Начальная карточка-инструкция
            addTextCard("СЕМЕЙНОЕ ДЕЛО №2026", "Добро пожаловать на доску расследований.\n\n• Перетаскивайте карточки.\n• Нажмите '+ Картинка' для загрузки фото.\n• Тяните за КРАСНУЮ ТОЧКУ снизу карточки, чтобы протянуть нить к другой уликe.");
        }

        // Панорамирование поля
        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target === workspace || e.target === svgLayer) {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                workspace.style.transform = `translate(${panX}px, ${panY}px)`;
            }

            if (isDraggingCard && activeCard) {
                const x = e.clientX - panX - activeCard.offsetX;
                const y = e.clientY - panY - activeCard.offsetY;
                activeCard.el.style.left = `${x}px`;
                activeCard.el.style.top = `${y}px`;
                updateThreads();
            }

            if (isDrawingThread && tempThread) {
                const rect = workspace.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const startCard = cards.find(c => c.id === threadStartCardId).el;
                const sRect = startCard.getBoundingClientRect();
                const sx = sRect.left + sRect.width / 2 - rect.left;
                const sy = sRect.bottom - 8 - rect.top;

                tempThread.setAttribute('d', `M ${sx} ${sy} C ${sx} ${(sy + mouseY)/2}, ${mouseX} ${(sy + mouseY)/2}, ${mouseX} ${mouseY}`);
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            isDraggingCard = false;
            activeCard = null;

            if (isDrawingThread) {
                isDrawingThread = false;
                if (tempThread) tempThread.remove();
                tempThread = null;
            }
        });

        // === 4. СОЗДАНИЕ И УПРАВЛЕНИЕ КАРТОЧКАМИ ===
        function addTextCard(title = "Новая улика", text = "") {
            cardCounter++;
            const id = cardCounter;

            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = id;

            // Позиционирование по центру видимого экрана
            const x = -panX + window.innerWidth / 2 - 120 + (Math.random() * 40 - 20);
            const y = -panY + window.innerHeight / 2 - 100 + (Math.random() * 40 - 20);
            card.style.left = `${x}px`;
            card.style.top = `${y}px`;

            card.innerHTML = `
                <div class="card-pin"></div>
                <button class="delete-card" onclick="deleteCard(${id})">✕</button>
                <input type="text" class="card-title" value="${title}">
                <textarea class="card-text" rows="4" placeholder="Введите текст...">${text}</textarea>
                <div class="connector" title="Потяни нить к другой уликe"></div>
            `;

            attachCardEvents(card, id);
            workspace.appendChild(card);
            cards.push({ id, el: card });
        }

        function triggerImageUpload(cardId = null) {
            pendingImgCardId = cardId;
            fileInput.click();
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const imgUrl = event.target.result;
                if (pendingImgCardId) {
                    // Замена картинки в существующей карточке
                    const imgEl = document.querySelector(`.card[data-id="${pendingImgCardId}"] .card-img-container img`);
                    if (imgEl) imgEl.src = imgUrl;
                } else {
                    // Создание новой карточки с картинкой
                    createImageCard(imgUrl);
                }
            };
            reader.readAsDataURL(file);
            fileInput.value = '';
        });

        function createImageCard(imgUrl) {
            cardCounter++;
            const id = cardCounter;

            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = id;

            const x = -panX + window.innerWidth / 2 - 120;
            const y = -panY + window.innerHeight / 2 - 100;
            card.style.left = `${x}px`;
            card.style.top = `${y}px`;

            card.innerHTML = `
                <div class="card-pin"></div>
                <button class="delete-card" onclick="deleteCard(${id})">✕</button>
                <div class="card-img-container">
                    <img src="${imgUrl}">
                    <button class="change-img-btn" onclick="triggerImageUpload(${id})">Заменить</button>
                </div>
                <input type="text" class="card-title" value="Фото-улика">
                <textarea class="card-text" rows="2" placeholder="Заметки к фото..."></textarea>
                <div class="connector" title="Потяни нить к другой уликe"></div>
            `;

            attachCardEvents(card, id);
            workspace.appendChild(card);
            cards.push({ id, el: card });
        }

        function attachCardEvents(card, id) {
            // Перетаскивание
            card.addEventListener('mousedown', (e) => {
                if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName) || e.target.classList.contains('connector')) return;
                isDraggingCard = true;
                activeCard = {
                    el: card,
                    offsetX: e.clientX - card.getBoundingClientRect().left,
                    offsetY: e.clientY - card.getBoundingClientRect().top
                };
                workspace.appendChild(card); // На передний план
            });

            // Нити
            const connector = card.querySelector('.connector');
            connector.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                isDrawingThread = true;
                threadStartCardId = id;

                tempThread = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempThread.classList.add('thread');
                svgLayer.appendChild(tempThread);
            });

            connector.addEventListener('mouseup', (e) => {
                e.stopPropagation();
                if (isDrawingThread && threadStartCardId && threadStartCardId !== id) {
                    // Создать связь если её ещё нет
                    if (!links.some(l => (l.from === threadStartCardId && l.to === id) || (l.from === id && l.to === threadStartCardId))) {
                        links.push({ from: threadStartCardId, to: id });
                        renderThreads();
                    }
                }
            });
        }

        function deleteCard(id) {
            const cardObj = cards.find(c => c.id === id);
            if (cardObj) {
                cardObj.el.remove();
                cards = cards.filter(c => c.id !== id);
                links = links.filter(l => l.from !== id && l.to !== id);
                renderThreads();
            }
        }

        // === 5. ОТРИСОВКА И ОБНОВЛЕНИЕ НИТЕЙ ===
        function renderThreads() {
            svgLayer.innerHTML = '';
            links.forEach((link, index) => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.classList.add('thread');
                path.dataset.index = index;
                path.title = "Кликните, чтобы удалить нить";
                
                path.addEventListener('click', () => {
                    links.splice(index, 1);
                    renderThreads();
                });

                svgLayer.appendChild(path);
            });
            updateThreads();
        }

        function updateThreads() {
            const rect = workspace.getBoundingClientRect();

            document.querySelectorAll('path.thread[data-index]').forEach(path => {
                const index = parseInt(path.dataset.index);
                const link = links[index];
                if (!link) return;

                const c1 = cards.find(c => c.id === link.from);
                const c2 = cards.find(c => c.id === link.to);
                if (!c1 || !c2) return;

                const r1 = c1.el.getBoundingClientRect();
                const r2 = c2.el.getBoundingClientRect();

                const x1 = r1.left + r1.width / 2 - rect.left;
                const y1 = r1.bottom - 8 - rect.top;

                const x2 = r2.left + r2.width / 2 - rect.left;
                const y2 = r2.top + 8 - rect.top;

                // Отрисовка сглаженной Безье-кривой
                path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${(y1 + y2)/2}, ${x2} ${(y1 + y2)/2}, ${x2} ${y2}`);
            });
        }
    </script>
</body>
</html>
