<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="fox">
    <title>ДОСКА • Семья</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подключение Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-canvas: #07090e;
            --card-bg: rgba(15, 20, 29, 0.85);
            --border-glow: #00f2fe;
            --accent-magenta: #ff0055;
            --accent-green: #00ff66;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ЭКРАН ВХОДА */
        #auth-screen {
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, #0f172a 0%, #030406 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .auth-box {
            background: rgba(13, 17, 23, 0.75); 
            backdrop-filter: blur(24px); 
            padding: 42px 36px; border-radius: 16px;
            border: 1px solid rgba(0, 242, 254, 0.25); text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 242, 254, 0.15); 
            max-width: 380px; width: 90%;
        }
        .auth-box h2 { 
            font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; 
            margin-bottom: 8px; color: #fff; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        .auth-box p { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 26px; font-family: 'JetBrains Mono', monospace; }
        .auth-box input {
            width: 100%; padding: 14px; background: rgba(5, 7, 10, 0.8); 
            border: 1px solid rgba(0, 242, 254, 0.3); color: var(--border-glow);
            font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; letter-spacing: 8px; 
            text-align: center; margin-bottom: 20px; border-radius: 8px; outline: none;
            transition: all 0.3s ease;
        }
        .auth-box input:focus {
            border-color: var(--border-glow);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        .auth-box button {
            width: 100%; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); 
            color: #030406; border: none; padding: 14px;
            font-family: 'JetBrains Mono', monospace; font-weight: 700; cursor: pointer; 
            border-radius: 8px; font-size: 0.9rem; letter-spacing: 1px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .auth-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        /* ЭКРАН СТОЛА (БЕЗ ЧЕРНЫХ ПОЛОС) */
        #room-screen {
            position: fixed; inset: 0; z-index: 9000; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #room-bg-group {
            position: absolute; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        .room-bg-img {
            position: absolute; width: 100%; height: 100%; 
            object-fit: cover; /* Исключает черные полосы по бокам */
            object-position: center;
            transition: opacity 0.35s ease;
        }
        #room-bg-hover { opacity: 0; pointer-events: none; }
        
        /* УВЕЛИЧЕННАЯ КНОПКА ПЛАНШЕТА */
        .tablet-hotspot {
            position: absolute; 
            top: 56.5%; left: 51.5%; transform: translate(-50%, -50%) rotate(-3deg);
            width: 38vw; height: 48vh; min-width: 300px; min-height: 220px;
            cursor: pointer; z-index: 9001; border-radius: 20px;
        }

        .zoom-active #room-bg-group { transform: scale(3.2); opacity: 0; }
        .zoom-active .tablet-hotspot { opacity: 0; pointer-events: none; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        #toolbar {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); padding: 8px 16px; border-radius: 40px;
            display: flex; gap: 12px; align-items: center; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .tool-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #00c6ff 100%); color: #060709; border: none; padding: 10px 22px;
            border-radius: 25px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease;
        }
        .tool-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }

        /* ОКНО СОЗДАНИЯ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 4, 6, 0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 9000;
        }
        .modal-box {
            background: rgba(17, 22, 31, 0.95); border: 1px solid rgba(0, 242, 254, 0.2); 
            padding: 30px; border-radius: 16px; width: 380px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-input, .modal-textarea {
            width: 100%; background: #080b10; border: 1px solid #21262d; color: #c9d1d9;
            padding: 12px; border-radius: 8px; outline: none; font-size: 0.85rem;
            transition: border 0.2s ease;
        }
        .modal-input:focus, .modal-textarea:focus { border-color: var(--border-glow); }
        .modal-file-label {
            display: block; width: 100%; padding: 12px; background: #161b22; border: 1px dashed rgba(0, 242, 254, 0.4);
            color: var(--text-sub); text-align: center; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .modal-file-label:hover { border-color: var(--border-glow); color: #fff; }
        .preview-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; display: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn-cancel { width: 50%; background: #21262d; color: var(--text-sub); border: none; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: 600; }
        .btn-confirm { width: 50%; background: var(--border-glow); color: #000; border: none; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: 700; }

        /* ХОЛСТ СЕТКА */
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; cursor: grab; }
        #viewport:active { cursor: grabbing; }

        #workspace {
            position: absolute; width: 8000px; height: 8000px; background-color: var(--bg-canvas);
            background-image: radial-gradient(rgba(0, 242, 254, 0.12) 1px, transparent 1px); background-size: 36px 36px;
            transform-origin: 0 0;
        }

        #svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        path.thread { 
            stroke: var(--border-glow); stroke-width: 2.5; fill: none; stroke-linecap: round; 
            pointer-events: stroke; cursor: pointer; filter: drop-shadow(0 0 6px var(--border-glow));
            transition: stroke 0.2s ease, stroke-width 0.2s ease;
        }
        path.thread:hover { stroke-width: 4.5; stroke: var(--accent-magenta); filter: drop-shadow(0 0 8px var(--accent-magenta)); }

        /* КАРТОЧКА СЕМЬИ */
        .card {
            position: absolute; background: var(--card-bg); backdrop-filter: blur(12px); color: var(--text-main);
            width: 280px; padding: 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); cursor: grab; z-index: 10;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { border-color: rgba(0, 242, 254, 0.4); box-shadow: 0 16px 40px rgba(0, 242, 254, 0.15); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--border-glow); font-weight: 500; }
        .delete-card { background: none; border: none; color: #484f58; cursor: pointer; font-size: 0.9rem; }
        .delete-card:hover { color: #f85149; }
        .card-name { font-size: 1.1rem; font-weight: 700; color: #f0f6fc; margin-bottom: 10px; }
        .card-img-container { width: 100%; height: 170px; background: #08090c; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .card-notes { 
            width: 100%; background: rgba(8, 11, 16, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #c9d1d9; font-size: 0.8rem; padding: 10px; border-radius: 8px; resize: none; outline: none; 
            font-family: inherit;
        }
        .card-notes:focus { border-color: rgba(0, 242, 254, 0.3); }
        .connector { 
            position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); 
            width: 16px; height: 16px; background: #00f2fe; border-radius: 50%; cursor: crosshair; z-index: 15; 
            box-shadow: 0 0 10px #00f2fe; border: 2px solid #000;
            transition: transform 0.2s ease;
        }
        .connector:hover { transform: translateX(-50%) scale(1.3); }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- 1. ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>ДОСТУП К ДОСКЕ</h2>
            <p>ВВЕДИТЕ ПИН-КОД</p>
            <input type="password" id="pass-input" placeholder="••••" maxlength="10">
            <button onclick="login()">ПОДТВЕРДИТЬ</button>
            <div id="error-msg" style="color: #f85149; font-size: 0.75rem; margin-top: 14px; font-family: 'JetBrains Mono', monospace; min-height: 15px;"></div>
        </div>
    </div>

    <!-- 2. ЭКРАН СТОЛА -->
    <div id="room-screen" style="display: none;">
        <div id="room-bg-group">
            <img id="room-bg" class="room-bg-img" src="desk.jpg" alt="Стол">
            <img id="room-bg-hover" class="room-bg-img" src="deskn.jpg" alt="Планшет">
        </div>
        <div class="tablet-hotspot" id="tablet-btn" onclick="zoomIntoTablet()"></div>
    </div>

    <!-- 3. ВЕРХНЕЕ МЕНЮ -->
    <div id="toolbar">
        <button class="tool-btn" onclick="openAddModal()">+ Добавить члена семьи</button>
    </div>

    <!-- 4. ОКНО ДОБАВЛЕНИЯ -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3 style="color:#fff; font-size: 1.1rem; font-family: 'JetBrains Mono', monospace;">НОВЫЙ ЧЛЕН СЕМЬИ</h3>
            <input type="text" id="modal-name" class="modal-input" placeholder="Имя и Фамилия...">
            <input type="text" id="modal-role" class="modal-input" placeholder="Роль (Брат, Сестра)...">
            <textarea id="modal-desc" class="modal-textarea" rows="3" placeholder="Заметки..."></textarea>
            
            <label for="modal-file-input" class="modal-file-label" id="modal-file-label">📷 Загрузить фото</label>
            <input type="file" id="modal-file-input" accept="image/*" onchange="previewModalImage(this)">
            <img id="modal-preview-img" class="preview-img">

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
                <button class="btn-confirm" onclick="confirmAddCard()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- 5. ДОСКА -->
    <div id="viewport">
        <div id="workspace">
            <svg id="svg-layer"></svg>
        </div>
    </div>

    <script>
        // === НАСТРОЙКА FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyA6niOG7ITQdSLI6iRScUvkdkkNouzCkNM",
            authDomain: "sosiska-family.firebaseapp.com",
            databaseURL: "https://sosiska-family-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sosiska-family",
            storageBucket: "sosiska-family.firebasestorage.app",
            messagingSenderId: "527481945819",
            appId: "1:527481945819:web:7e7ea02873809406f156fe",
            measurementId: "G-51DKR1NY40"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) { console.log("Firebase ошибка инициализации:", e); }

        // === ПАРОЛЬ ===
        const TARGET_HASH = "158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab";
        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function login() {
            const input = document.getElementById('pass-input').value.trim();
            if ((await sha256(input)) === TARGET_HASH) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('room-screen').style.display = 'flex';
            } else {
                document.getElementById('error-msg').innerText = "Неверный код доступа";
            }
        }

        // Подсвечивание планшета при наведении на hotspot
        const tabletBtn = document.getElementById('tablet-btn');
        const roomBgHover = document.getElementById('room-bg-hover');
        tabletBtn.addEventListener('mouseenter', () => roomBgHover.style.opacity = '1');
        tabletBtn.addEventListener('mouseleave', () => roomBgHover.style.opacity = '0');

        function zoomIntoTablet() {
            document.getElementById('room-screen').classList.add('zoom-active');
            setTimeout(() => {
                document.getElementById('room-screen').style.display = 'none';
                initBoard();
            }, 700);
        }

        // === ДВИЖОК ДОСКИ ===
        const viewport = document.getElementById('viewport');
        const workspace = document.getElementById('workspace');
        const svgLayer = document.getElementById('svg-layer');

        let panX = -3500, panY = -3500, isPanning = false, startX, startY;
        let cards = [], links = [], cardCounter = 0;
        let isDraggingCard = false, activeCard = null;
        let isDrawingThread = false, threadStartCardId = null, tempThread = null;
        let tempModalImageData = null;

        function initBoard() {
            workspace.style.transform = `translate(${panX}px, ${panY}px)`;
            
            // Синхронизация с Firebase в реальном времени
            if (db) {
                db.ref('family_board').on('value', (snapshot) => {
                    const data = snapshot.val() || { cards: [], links: [] };
                    clearBoardUI();
                    cards = [];
                    links = data.links || [];
                    (data.cards || []).forEach(c => {
                        if (c.id > cardCounter) cardCounter = c.id;
                        renderCardInstance(c);
                    });
                    renderThreads();
                });
            }
        }

        function saveToCloud() {
            if (db) {
                db.ref('family_board').set({
                    cards: cards.map(c => c.data),
                    links: links
                });
            }
        }

        function clearBoardUI() {
            document.querySelectorAll('.card').forEach(el => el.remove());
            svgLayer.innerHTML = '';
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target === workspace || e.target === svgLayer) {
                isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX; panY = e.clientY - startY;
                workspace.style.transform = `translate(${panX}px, ${panY}px)`;
            }
            if (isDraggingCard && activeCard) {
                const x = e.clientX - panX - activeCard.offsetX;
                const y = e.clientY - panY - activeCard.offsetY;
                activeCard.el.style.left = `${x}px`; activeCard.el.style.top = `${y}px`;
                activeCard.data.left = x; activeCard.data.top = y;
                updateThreads();
            }
            if (isDrawingThread && tempThread) {
                const rect = workspace.getBoundingClientRect();
                const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
                const startCard = cards.find(c => c.id === threadStartCardId).el;
                const sRect = startCard.getBoundingClientRect();
                const sx = sRect.left + sRect.width / 2 - rect.left, sy = sRect.bottom - 8 - rect.top;
                tempThread.setAttribute('d', `M ${sx} ${sy} C ${sx} ${(sy + mouseY)/2}, ${mouseX} ${(sy + mouseY)/2}, ${mouseX} ${mouseY}`);
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            if (isDraggingCard) { isDraggingCard = false; activeCard = null; saveToCloud(); }
            if (isDrawingThread) { isDrawingThread = false; if (tempThread) tempThread.remove(); tempThread = null; }
        });

        function openAddModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-role').value = '';
            document.getElementById('modal-desc').value = '';
            document.getElementById('modal-preview-img').style.display = 'none';
            tempModalImageData = null;
        }

        function closeAddModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        function previewModalImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                tempModalImageData = e.target.result;
                const img = document.getElementById('modal-preview-img');
                img.src = tempModalImageData; img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function confirmAddCard() {
            cardCounter++;
            const cardData = {
                id: cardCounter,
                name: document.getElementById('modal-name').value.trim() || "Без имени",
                role: document.getElementById('modal-role').value.trim() || "Семья",
                desc: document.getElementById('modal-desc').value.trim() || "",
                imgSrc: tempModalImageData || "https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?auto=format&fit=crop&w=300&q=80",
                left: -panX + window.innerWidth / 2 - 140,
                top: -panY + window.innerHeight / 2 - 160
            };
            cards.push({ id: cardData.id, el: null, data: cardData });
            saveToCloud();
            closeAddModal();
        }

        function renderCardInstance(data) {
            const card = document.createElement('div');
            card.className = 'card'; card.dataset.id = data.id;
            card.style.left = `${data.left}px`; card.style.top = `${data.top}px`;
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-tag">${data.role}</span>
                    <button class="delete-card" onclick="deleteCard(${data.id})">✕</button>
                </div>
                <div class="card-name">${data.name}</div>
                <div class="card-img-container"><img src="${data.imgSrc}"></div>
                <textarea class="card-notes" rows="3" placeholder="Заметки...">${data.desc}</textarea>
                <div class="connector"></div>
            `;
            attachCardEvents(card, data.id, data);
            workspace.appendChild(card);
            const found = cards.find(c => c.id === data.id);
            if (found) found.el = card; else cards.push({ id: data.id, el: card, data });
        }

        function attachCardEvents(card, id, dataObj) {
            card.addEventListener('mousedown', (e) => {
                if (['TEXTAREA', 'BUTTON'].includes(e.target.tagName) || e.target.classList.contains('connector')) return;
                isDraggingCard = true;
                activeCard = { el: card, data: dataObj, offsetX: e.clientX - card.getBoundingClientRect().left, offsetY: e.clientY - card.getBoundingClientRect().top };
            });

            card.querySelector('.card-notes').addEventListener('change', (e) => {
                dataObj.desc = e.target.value;
                saveToCloud();
            });

            const connector = card.querySelector('.connector');
            connector.addEventListener('mousedown', (e) => {
                e.stopPropagation(); isDrawingThread = true; threadStartCardId = id;
                tempThread = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempThread.classList.add('thread'); svgLayer.appendChild(tempThread);
            });

            connector.addEventListener('mouseup', (e) => {
                e.stopPropagation();
                if (isDrawingThread && threadStartCardId && threadStartCardId !== id) {
                    if (!links.some(l => (l.from === threadStartCardId && l.to === id) || (l.from === id && l.to === threadStartCardId))) {
                        links.push({ from: threadStartCardId, to: id });
                        saveToCloud();
                    }
                }
            });
        }

        function deleteCard(id) {
            cards = cards.filter(c => c.id !== id);
            links = links.filter(l => l.from !== id && l.to !== id);
            saveToCloud();
        }

        function renderThreads() {
            svgLayer.innerHTML = '';
            links.forEach((link, index) => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.classList.add('thread'); path.dataset.index = index;
                path.addEventListener('click', () => { links.splice(index, 1); saveToCloud(); });
                svgLayer.appendChild(path);
            });
            updateThreads();
        }

        function updateThreads() {
            const rect = workspace.getBoundingClientRect();
            document.querySelectorAll('path.thread[data-index]').forEach(path => {
                const link = links[parseInt(path.dataset.index)];
                if (!link) return;
                const c1 = cards.find(c => c.id === link.from), c2 = cards.find(c => c.id === link.to);
                if (!c1 || !c2 || !c1.el || !c2.el) return;
                const r1 = c1.el.getBoundingClientRect(), r2 = c2.el.getBoundingClientRect();
                const x1 = r1.left + r1.width / 2 - rect.left, y1 = r1.bottom - 8 - rect.top;
                const x2 = r2.left + r2.width / 2 - rect.left, y2 = r2.top + 8 - rect.top;
                path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${(y1 + y2)/2}, ${x2} ${(y1 + y2)/2}, ${x2} ${y2}`);
            });
        }
    </script>
</body>
</html>
