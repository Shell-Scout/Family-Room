<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ДОСКА • Семья</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подключение Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-canvas: #07090e;
            --card-bg: rgba(15, 20, 29, 0.85);
            --border-glow: #00f2fe;
            --accent-magenta: #ff0055;
            --accent-green: #00ff66;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ЭКРАН СТОЛА */
        #room-screen {
            position: fixed; inset: 0; z-index: 9000; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #room-bg-group {
            position: absolute; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        .room-bg-img {
            position: absolute; width: 100%; height: 100%; 
            object-fit: cover; object-position: center;
            transition: opacity 0.35s ease;
        }
        #room-bg-hover { opacity: 0; pointer-events: none; }
        
        .tablet-hotspot {
            position: absolute; 
            top: 56.5%; left: 51.5%; transform: translate(-50%, -50%) rotate(-3deg);
            width: 38vw; height: 48vh; min-width: 300px; min-height: 220px;
            cursor: pointer; z-index: 9001; border-radius: 20px;
        }

        .zoom-active #room-bg-group { transform: scale(3.2); opacity: 0; }
        .zoom-active .tablet-hotspot { opacity: 0; pointer-events: none; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        #toolbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); padding: 8px 18px; border-radius: 40px;
            display: flex; gap: 12px; align-items: center; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .tool-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #00c6ff 100%); color: #060709; border: none; padding: 8px 18px;
            border-radius: 25px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .tool-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4); }

        .tool-btn-secondary {
            background: rgba(255, 255, 255, 0.08); color: #e6edf3; border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .tool-btn-secondary:hover { background: rgba(255, 255, 255, 0.18); border-color: var(--border-glow); }

        .admin-status-btn {
            background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); color: var(--border-glow);
            padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
            font-family: 'JetBrains Mono', monospace; transition: all 0.2s ease;
        }
        .admin-status-btn:hover { background: rgba(0, 242, 254, 0.25); box-shadow: 0 0 12px rgba(0, 242, 254, 0.3); }

        .divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.15); }
        .zoom-display { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--border-glow); min-width: 48px; text-align: center; }
        .audio-controls { display: flex; align-items: center; gap: 8px; }
        .volume-slider { width: 60px; accent-color: var(--border-glow); cursor: pointer; }

        /* ОГРАНИЧЕНИЕ ПРАВ В РЕЖИМЕ ПРОСМОТРА */
        body:not(.edit-mode) .admin-only { display: none !important; }
        body:not(.edit-mode) .admin-hidden { display: block !important; }
        body.edit-mode .admin-hidden { display: none !important; }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 4, 6, 0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .modal-box {
            background: rgba(17, 22, 31, 0.95); border: 1px solid rgba(0, 242, 254, 0.25); 
            padding: 30px; border-radius: 16px; width: 380px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center;
        }
        .modal-box h3 { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: #fff; }
        .modal-input, .modal-textarea {
            width: 100%; background: #080b10; border: 1px solid #21262d; color: #c9d1d9;
            padding: 12px; border-radius: 8px; outline: none; font-size: 0.85rem; transition: border 0.2s ease;
        }
        .modal-input:focus, .modal-textarea:focus { border-color: var(--border-glow); }
        .modal-file-label {
            display: block; width: 100%; padding: 12px; background: #161b22; border: 1px dashed rgba(0, 242, 254, 0.4);
            color: var(--text-sub); text-align: center; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
        }
        .preview-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; display: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn-cancel { width: 50%; background: #21262d; color: var(--text-sub); border: none; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: 600; }
        .btn-confirm { width: 50%; background: var(--border-glow); color: #000; border: none; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: 700; }

        /* ХОЛСТ И СЕТКА */
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; cursor: grab; }
        #viewport:active { cursor: grabbing; }

        #workspace {
            position: absolute; width: 8000px; height: 8000px; background-color: var(--bg-canvas);
            background-image: radial-gradient(rgba(0, 242, 254, 0.12) 1px, transparent 1px); background-size: 36px 36px;
            transform-origin: 0 0;
        }

        #svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        path.thread { 
            stroke: var(--border-glow); stroke-width: 2.5; fill: none; stroke-linecap: round; 
            pointer-events: stroke; cursor: pointer; filter: drop-shadow(0 0 6px var(--border-glow));
            transition: stroke 0.2s ease, stroke-width 0.2s ease;
        }
        path.thread:hover { stroke-width: 4.5; stroke: var(--accent-magenta); filter: drop-shadow(0 0 8px var(--accent-magenta)); }

        /* КАРТОЧКА СЕМЬИ */
        .card {
            position: absolute; background: var(--card-bg); backdrop-filter: blur(12px); color: var(--text-main);
            width: 280px; padding: 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); cursor: grab; z-index: 10;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { border-color: rgba(0, 242, 254, 0.4); box-shadow: 0 16px 40px rgba(0, 242, 254, 0.15); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--border-glow); font-weight: 500; text-transform: uppercase; }
        
        /* Стили для полей ввода в режиме редактирования */
        .card-tag-input {
            background: transparent; border: none; padding: 0; color: inherit; font-family: inherit; font-size: inherit; text-transform: uppercase;
        }
        .card-tag-input:focus { outline: 1px solid var(--border-glow); }

        .card-name-input {
            background: transparent; border: none; padding: 0; color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit;
        }
        .card-name-input:focus { outline: 1px solid var(--border-glow); }

        .delete-card { background: none; border: none; color: #484f58; cursor: pointer; font-size: 0.9rem; }
        .delete-card:hover { color: #f85149; }
        
        .card-name { font-size: 1.1rem; font-weight: 700; color: #f0f6fc; margin-bottom: 10px; }
        
        .card-img-container { width: 100%; height: 170px; background: #08090c; border-radius: 8px; margin-bottom: 12px; overflow: hidden; position: relative; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Стиль для оверлея редактирования фото */
        .card-img-edit-overlay {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); color: #fff;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
            opacity: 0; transition: opacity 0.2s ease; cursor: pointer;
        }
        .card-img-container:hover .card-img-edit-overlay { opacity: 1; }

        .card-notes { 
            width: 100%; background: rgba(8, 11, 16, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #c9d1d9; font-size: 0.8rem; padding: 10px; border-radius: 8px; resize: none; outline: none; 
            font-family: inherit;
        }
        .card-notes:focus { border-color: rgba(0, 242, 254, 0.3); }
        .connector { 
            position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); 
            width: 16px; height: 16px; background: #00f2fe; border-radius: 50%; cursor: crosshair; z-index: 15; 
            box-shadow: 0 0 10px #00f2fe; border: 2px solid #000; transition: transform 0.2s ease;
        }
        .connector:hover { transform: translateX(-50%) scale(1.3); }

        input[type="file"] { display: none; }
    </style>
</head>
<body class="public-mode">

    <!-- ФОНОВАЯ РЕЛАКС МУЗЫКА -->
    <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"></audio>

    <!-- 1. ЭКРАН СТОЛА -->
    <div id="room-screen">
        <div id="room-bg-group">
            <img id="room-bg" class="room-bg-img" src="desk.jpg" alt="Стол">
            <img id="room-bg-hover" class="room-bg-img" src="deskn.jpg" alt="Планшет">
        </div>
        <div class="tablet-hotspot" id="tablet-btn" onclick="zoomIntoTablet()"></div>

    <!-- 2. ВЕРХНЕЕ МЕНЮ -->
    <div id="toolbar">

    <!-- 4. ОКНО ДОБАВЛЕНИЯ ЧЛЕНА СЕМЬИ -->

            <label for="modal-file-input" class="modal-file-label" id="modal-file-label">📷 Загрузить фото</label>

    <!-- 5. ДОСКА -->
    <div id="viewport">
        <div id="workspace">
            <svg id="svg-layer"></svg>
        </div>
    </div>

    <script>
        // === НАСТРОЙКА FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyA6niOG7ITQdSLI6iRScUvkdkkNouzCkNM",
            authDomain: "sosiska-family.firebaseapp.com",
            databaseURL: "https://sosiska-family-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sosiska-family",

            messagingSenderId: "527481945819",
            appId: "1:527481945819:web:7e7ea02873809406f156fe",
            measurementId: "G-51DKR1NY40"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) { console.log("Firebase ошибка инициализации:", e); }

        // === ГЕНЕРАТОР ЗВУКОВЫХ ЭФФЕКТОВ (Web Audio API) ===
        class SoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playClick() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.04);
            }
            playTabletZoom() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(90, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(550, this.ctx.currentTime + 0.65);
                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + 0.35);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.65);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.65);
            }
            playConnect() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.07);
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
            playDelete() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
        }
        const sfx = new SoundEngine();

        // Авто-инициализация звуков при первом клике пользователя (Обход автоплей политики)
        function unlockAudioOnFirstInteraction() {
            sfx.init();
            playMusicOnInteraction(); // Also attempt music on first click.
            window.removeEventListener('click', unlockAudioOnFirstInteraction);
            window.removeEventListener('keydown', unlockAudioOnFirstInteraction);
            window.removeEventListener('touchstart', unlockAudioOnFirstInteraction);
        }
        window.addEventListener('click', unlockAudioOnFirstInteraction);
        window.addEventListener('keydown', unlockAudioOnFirstInteraction);
        window.addEventListener('touchstart', unlockAudioOnFirstInteraction);

        // === МУЗЫКА ===
        const bgMusic = document.getElementById('bg-music');
        let musicPlaying = true; // Music button state 'Вкл' default.
        bgMusic.volume = 0.3;

        // Broad attempt to play music, requires prior user interaction. 
        // Modern browsers block autoplay. This makes the text reflect that it's *attempting* and will play on next click.
        function playMusicOnInteraction() {
            if (musicPlaying && bgMusic.paused) {
                 bgMusic.play().then(() => {
                    document.getElementById('music-btn').innerText = "🎵 Музыка: Вкл";
                }).catch(() => {
                    // Browser blocked autoplay. Wait for another interaction. Button stays 'Вкл'.
                });
            }
        }

        function toggleMusic() {
            sfx.playClick();
            if (musicPlaying) {
                bgMusic.pause();
                musicPlaying = false;
                document.getElementById('music-btn').innerText = "🔇 Музыка: Выкл";
            } else {
                musicPlaying = true;
                bgMusic.play().then(() => {
                    document.getElementById('music-btn').innerText = "🎵 Музыка: Вкл";
                }).catch(() => {
                    // Browser blocked autoplay. Wait for user interaction. Button stays 'Вкл'.
                });
            }
        }

        function setVolume(val) { bgMusic.volume = val; }

        // === БЕЗОПАСНОСТЬ И РЕЖИМ АДМИНА ===
        // SHA-256 хэш нового пароля `#%&,p3H[RPPP(csw`
        const TARGET_HASH = "3f2334f3c05423f05a113a0053229b119102c7e0c4c44f075024e030c25a0753";
        let isEditMode = false;

        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function toggleAdminMode() {
            sfx.playClick();
            if (isEditMode) {
                isEditMode = false;
                document.body.classList.remove('edit-mode');
                document.getElementById('admin-toggle-btn').innerText = "🔒 Вход (Админ)";
                renderThreads();
            } else {
                document.getElementById('admin-pass-input').value = '';
                document.getElementById('auth-error-msg').innerText = '';
                document.getElementById('auth-modal').style.display = 'flex';
            }
        }

        function closeAuthModal() {
            sfx.playClick();
            document.getElementById('auth-modal').style.display = 'none';
        }

        async function confirmAdminLogin() {
            sfx.playClick();
            const input = document.getElementById('admin-pass-input').value.trim();
            if ((await sha256(input)) === TARGET_HASH) {
                isEditMode = true;
                document.body.classList.add('edit-mode');
                document.getElementById('admin-toggle-btn').innerText = "🔓 Выйти (Админ)";
                closeAuthModal();
                renderThreads();
            } else {
                document.getElementById('auth-error-msg').innerText = "Неверный PIN-код";
            }
        }

        // Подсвечивание планшета при наведении
        const tabletBtn = document.getElementById('tablet-btn');
        const roomBgHover = document.getElementById('room-bg-hover');
        tabletBtn.addEventListener('mouseenter', () => roomBgHover.style.opacity = '1');
        tabletBtn.addEventListener('mouseleave', () => roomBgHover.style.opacity = '0');

        function zoomIntoTablet() {
            sfx.playTabletZoom();
            document.getElementById('room-screen').classList.add('zoom-active');
            setTimeout(() => {
                document.getElementById('room-screen').style.display = 'none';
                initBoard();
                playMusicOnInteraction(); // First interaction plays music.
            }, 700);
        }

        // === ДВИЖОК ДОСКИ И ЗУМА ===
        const viewport = document.getElementById('viewport');
        const workspace = document.getElementById('workspace');
        const svgLayer = document.getElementById('svg-layer');

        let panX = -3500, panY = -3500, zoom = 1;
        const MIN_ZOOM = 0.35, MAX_ZOOM = 2.2;
        let isPanning = false, startX, startY;
        let cards = [], links = [], cardCounter = 0;
        let isDraggingCard = false, activeCard = null;
        let isDrawingThread = false, threadStartCardId = null, tempThread = null;
        let tempModalImageData = null;

        function updateWorkspaceTransform() {
            workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
            document.getElementById('zoom-val').innerText = `${Math.round(zoom * 100)}%`;
            updateThreads();
        }

        function changeZoom(delta) {
            sfx.playClick();
            const centerPointX = window.innerWidth / 2, centerPointY = window.innerHeight / 2;
            zoomIntoPoint(centerPointX, centerPointY, delta);
        }

        function resetZoom() {
            sfx.playClick();
            zoom = 1;
            updateWorkspaceTransform();
        }

        function zoomIntoPoint(mouseX, mouseY, delta) {
            const newZoom = Math.min(Math.max(zoom + delta, MIN_ZOOM), MAX_ZOOM);
            if (newZoom !== zoom) {
                panX -= (mouseX - panX) * (newZoom / zoom - 1);
                panY -= (mouseY - panY) * (newZoom / zoom - 1);
                zoom = newZoom;
                updateWorkspaceTransform();
            }
        }

        // Зум колесиком мыши в точку курсора
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.0012, delta = -e.deltaY * zoomSpeed;
            zoomIntoPoint(e.clientX, e.clientY, delta);
        }, { passive: false });

        function initBoard() {
            updateWorkspaceTransform();
            if (db) {
                db.ref('family_board').on('value', (snapshot) => {
                    const data = snapshot.val() || { cards: [], links: [] };
                    clearBoardUI();
                    cards = [];
                    links = data.links || [];
                    (data.cards || []).forEach(c => {
                        if (c.id > cardCounter) cardCounter = c.id;
                        renderCardInstance(c);
                    });
                    renderThreads();
                });
            }
        }

        function saveToCloud() {
            if (db && isEditMode) {
                db.ref('family_board').set({
                    cards: cards.map(c => c.data),
                    links: links
                });
            }
        }

        function clearBoardUI() {
            document.querySelectorAll('.card').forEach(el => el.remove());
            svgLayer.innerHTML = '';
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target === workspace || e.target === svgLayer) {
                isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX; panY = e.clientY - startY;
                updateWorkspaceTransform();
            }
            if (isDraggingCard && activeCard && isEditMode) {
                const rect = workspace.getBoundingClientRect();
                const x = (e.clientX - rect.left) / zoom - activeCard.offsetX;
                const y = (e.clientY - rect.top) / zoom - activeCard.offsetY;
                activeCard.el.style.left = `${x}px`; activeCard.el.style.top = `${y}px`;
                activeCard.data.left = x; activeCard.data.top = y;
                updateThreads();
            }
            if (isDrawingThread && tempThread && isEditMode) {
                const rect = workspace.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) / zoom, mouseY = (e.clientY - rect.top) / zoom;
                const startCard = cards.find(c => c.id === threadStartCardId);
                if (startCard && startCard.el) {
                    const sx = startCard.data.left + 140, sy = startCard.data.top + startCard.el.offsetHeight - 8;
                    tempThread.setAttribute('d', `M ${sx} ${sy} C ${sx} ${(sy + mouseY)/2}, ${mouseX} ${(sy + mouseY)/2}, ${mouseX} ${mouseY}`);
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            if (isDraggingCard) { isDraggingCard = false; activeCard = null; saveToCloud(); }
            if (isDrawingThread) { isDrawingThread = false; if (tempThread) tempThread.remove(); tempThread = null; }
        });

        function openAddModal() {
            if (!isEditMode) return;
            sfx.playClick();
            document.getElementById('add-modal').style.display = 'flex';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-role').value = '';
            document.getElementById('modal-desc').value = '';
            document.getElementById('modal-preview-img').style.display = 'none';
            tempModalImageData = null;
        }

        function closeAddModal() { sfx.playClick(); document.getElementById('add-modal').style.display = 'none'; }

        function previewModalImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                tempModalImageData = e.target.result;
                const img = document.getElementById('modal-preview-img');
                img.src = tempModalImageData; img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function confirmAddCard() {
            if (!isEditMode) return;
            sfx.playClick();
            cardCounter++;
            const cardData = {
                id: cardCounter,
                name: document.getElementById('modal-name').value.trim() || "Без имени",
                role: document.getElementById('modal-role').value.trim() || "Семья",
                desc: document.getElementById('modal-desc').value.trim() || "",
                imgSrc: tempModalImageData || "https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?auto=format&fit=crop&w=300&q=80",
                left: (-panX + window.innerWidth / 2 - 140 * zoom) / zoom,
                top: (-panY + window.innerHeight / 2 - 160 * zoom) / zoom
            };
            cards.push({ id: cardData.id, el: null, data: cardData });
            saveToCloud();
            closeAddModal();
        }

        function renderCardInstance(data) {
            const card = document.createElement('div');
            card.className = 'card'; card.dataset.id = data.id;
            card.style.left = `${data.left}px`; card.style.top = `${data.top}px`;
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-tag card-tag-view admin-hidden">${data.role}</span>
                    <input type="text" class="card-tag card-tag-input admin-only" value="${data.role}" placeholder="Роль..." data-card-id="${data.id}" onblur="updateCardRole(this)">
                    <button class="delete-card admin-only" onclick="deleteCard(${data.id})">✕</button>
                </div>
                <div class="card-name card-name-view admin-hidden">${data.name}</div>
                <input type="text" class="card-name card-name-input admin-only" value="${data.name}" placeholder="Имя и Фамилия..." data-card-id="${data.id}" onblur="updateCardName(this)">
                
                <div class="card-img-container">
                    <img src="${data.imgSrc}">
                    <div class="card-img-edit-overlay admin-only" onclick="triggerCardImageUpload(${data.id})">
                        <span>📷</span>
                        <span style="font-size: 0.7rem;">Заменить фото</span>
                        <input type="file" class="card-img-file-input" accept="image/*" onchange="handleCardImageUpdate(this, ${data.id})">
                    </div>
                </div>
                <textarea class="card-notes" rows="3" placeholder="Заметки...">${data.desc}</textarea>
                <div class="connector admin-only"></div>
            `;
            attachCardEvents(card, data.id, data);
            workspace.appendChild(card);
            const found = cards.find(c => c.id === data.id);
            if (found) found.el = card; else cards.push({ id: data.id, el: card, data });
        }

        function attachCardEvents(card, id, dataObj) {
            card.addEventListener('mousedown', (e) => {
                if (!isEditMode || ['TEXTAREA', 'BUTTON', 'INPUT'].includes(e.target.tagName) || e.target.classList.contains('connector') || e.target.classList.contains('card-img-edit-overlay')) return;
                isDraggingCard = true;
                const cardRect = card.getBoundingClientRect();
                activeCard = { el: card, data: dataObj, offsetX: (e.clientX - cardRect.left) / zoom, offsetY: (e.clientY - cardRect.top) / zoom };
                workspace.appendChild(card); // Move to front
            });

            card.querySelector('.card-notes').addEventListener('change', (e) => {
                if (!isEditMode) return;
                dataObj.desc = e.target.value;
                saveToCloud();
            });

            const connector = card.querySelector('.connector');
            connector.addEventListener('mousedown', (e) => {
                if (!isEditMode) return;
                e.stopPropagation(); isDrawingThread = true; threadStartCardId = id;
                tempThread = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempThread.classList.add('thread'); svgLayer.appendChild(tempThread);
            });

            connector.addEventListener('mouseup', (e) => {
                if (!isEditMode) return;
                e.stopPropagation();
                if (isDrawingThread && threadStartCardId && threadStartCardId !== id) {
                    if (!links.some(l => (l.from === threadStartCardId && l.to === id) || (l.from === id && l.to === threadStartCardId))) {
                        links.push({ from: threadStartCardId, to: id });
                        sfx.playConnect(); saveToCloud();
                    }
                }
            });
        }

        function deleteCard(id) {
            if (!isEditMode) return;
            sfx.playDelete();
            cards = cards.filter(c => c.id !== id);
            links = links.filter(l => l.from !== id && l.to !== id);
            saveToCloud();
        }

        function updateCardData(id, name, role, notes, imgSrc) {
            if (!isEditMode) return;
            const cardObj = cards.find(c => c.id === id);
            if (cardObj) {
                if (name !== undefined) cardObj.data.name = name;
                if (role !== undefined) cardObj.data.role = role;
                if (notes !== undefined) cardObj.data.desc = notes;
                if (imgSrc !== undefined) cardObj.data.imgSrc = imgSrc;
                saveToCloud();
            }
        }

        // --- Внутренние функции для редактирования полей карточек ---
        function updateCardName(input) {
            if (!isEditMode) return;
            const id = parseInt(input.dataset.cardId), name = input.value.trim() || "Без имени";
            updateCardData(id, name, undefined, undefined, undefined);
            const viewName = input.closest('.card').querySelector('.card-name-view');
            if (viewName) viewName.innerText = name;
        }
        function updateCardRole(input) {
            if (!isEditMode) return;
            const id = parseInt(input.dataset.cardId), role = input.value.trim() || "Семья";
            updateCardData(id, undefined, role, undefined, undefined);
            const viewTag = input.closest('.card').querySelector('.card-tag-view');
            if (viewTag) viewTag.innerText = role;
        }
        function triggerCardImageUpload(id) {
            if (!isEditMode) return;
            const card = workspace.querySelector(`.card[data-id="${id}"]`);
            if (card) card.querySelector('.card-img-file-input').click();
        }
        function handleCardImageUpdate(input, id) {
            if (!isEditMode) return;
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataURL = e.target.result;
                updateCardData(id, undefined, undefined, undefined, dataURL);
                const card = workspace.querySelector(`.card[data-id="${id}"]`);
                if (card) card.querySelector('.card-img-container img').src = dataURL;
            };
            reader.readAsDataURL(file);
        }

        function renderThreads() {
            svgLayer.innerHTML = '';
            links.forEach((link, index) => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.classList.add('thread'); path.dataset.index = index;
                if (isEditMode) path.addEventListener('click', () => { sfx.playDelete(); links.splice(index, 1); saveToCloud(); });
                svgLayer.appendChild(path);
            });
            updateThreads();
        }

        function updateThreads() {
            document.querySelectorAll('path.thread[data-index]').forEach(path => {
                const link = links[parseInt(path.dataset.index)];
                if (!link) return;
                const c1 = cards.find(c => c.id === link.from), c2 = cards.find(c => c.id === link.to);
                if (!c1 || !c2 || !c1.el || !c2.el) return;
                const x1 = c1.data.left + 140, y1 = c1.data.top + c1.el.offsetHeight - 8;
                const x2 = c2.data.left + 140, y2 = c2.data.top + 8;
                path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${(y1 + y2)/2}, ${x2} ${(y1 + y2)/2}, ${x2} ${y2}`);
            });
        }
    </script>
</body>
</html>
